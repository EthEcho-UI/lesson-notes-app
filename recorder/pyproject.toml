[project]
name = "lesson-record"
version = "0.1.0"
description = "Laptop recorder: records lessons/meetings (mic, or mic + system audio) and hands them to the lesson-notes worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pillow>=10,<13",         # photos: resize + EXIF strip (same limits as the contract)
  "lesson-worker",          # shares the GitHub client, config/token handling and contract validation
]

[tool.uv.sources]
lesson-worker = { path = "../worker", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "numpy>=1.26,<3"]

[project.scripts]
lesson-record = "lesson_record.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lesson_record"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "audio: needs pipewire/wireplumber/pipewire-pulse binaries (runs in a private, isolated audio server)",
]
