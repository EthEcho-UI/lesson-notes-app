<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#37474f" /></marker></defs><rect x="0" y="0" width="800" height="500" fill="#ffffff" /><text x="400" y="50" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#263238">Akce a reakce</text><rect x="60" y="170" width="200" height="140" fill="#e3f2fd" stroke="#455a64" stroke-width="2" /><text x="160" y="250" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#263238">Těleso A</text><rect x="540" y="170" width="200" height="140" fill="#fff3e0" stroke="#455a64" stroke-width="2" /><text x="640" y="250" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#263238">Těleso B</text><line x1="262" y1="215" x2="538" y2="215" stroke="#455a64" stroke-width="2" marker-end="url(#arr)" /><text x="400" y="195" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#263238">F₁: A působí na B</text><line x1="538" y1="265" x2="262" y2="265" stroke="#455a64" stroke-width="2" marker-end="url(#arr)" /><text x="400" y="300" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#263238">F₂: B působí na A</text><text x="400" y="380" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#263238">F₁ = −F₂</text><text x="400" y="420" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#263238">stejná velikost, opačný směr, různá tělesa</text></svg>